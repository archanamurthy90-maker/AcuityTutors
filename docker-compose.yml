services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: acuity_tutors
      POSTGRES_USER: acuity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acuity_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - acuity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acuity -d acuity_tutors"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acuity_postgres_data:
